<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>11versus11 Pixel Soccer Mini — Phaser Prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin:0; width:100%; height:100%; background:#101820; }
      #game-root { width:800px; height:600px; }
      canvas { display:block; }
    </style>
  </head>
  <body>
    <!-- Global error overlay: displays runtime errors on the page -->
    <style>
      #pf-error-overlay{position:fixed;left:8px;right:8px;top:8px;background:#200;color:#fff;padding:12px;border-radius:6px;z-index:9999;font-family:monospace;white-space:pre-wrap;max-height:60vh;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,0.5)}
      #pf-error-overlay h4{margin:0 0 6px 0;font-weight:700}
    </style>
    <script>
      function showPFError(msg){
        try{
          console.error(msg);
          var el = document.getElementById('pf-error-overlay');
          if(!el){
            el = document.createElement('div'); el.id = 'pf-error-overlay';
            var h = document.createElement('h4'); h.textContent = 'Runtime Error'; el.appendChild(h);
            var pre = document.createElement('div'); pre.id = 'pf-error-pre'; el.appendChild(pre);
            document.body.appendChild(el);
          }
          document.getElementById('pf-error-pre').textContent = String(msg);
        }catch(e){console.error('Failed to render error overlay', e)}
      }
      window.onerror = function(message, source, lineno, colno, error){
        var m = message + '\n' + source + ':' + lineno + ':' + colno + '\n' + (error && error.stack ? error.stack : '');
        showPFError(m);
      };
      window.addEventListener('unhandledrejection', function(e){
        showPFError('UnhandledRejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
      });
    </script>

    <div id="game-root"></div>
    <script src="phaser.min.js"></script>
    <script>
      if(!window.Phaser){
        showPFError('Failed to initialize Phaser from local phaser.min.js');
      }
    </script>
    <script src="main.js"></script>
    <script>
      // Diagnostic fetcher: reports whether files are reachable and can optionally eval main.js
      (function(){
        const diag = document.createElement('div');
        diag.style.position='fixed'; diag.style.left='8px'; diag.style.bottom='8px'; diag.style.padding='8px'; diag.style.zIndex=9999; diag.style.background='rgba(0,0,0,0.6)'; diag.style.color='#fff'; diag.style.fontFamily='monospace'; diag.id='pf-diag';
        diag.textContent = 'Diagnostics: checking files...'; document.body.appendChild(diag);

        function write(s){ try{ diag.textContent += '\n'+s }catch(e){} }

        Promise.allSettled([
          fetch('phaser.min.js').then(r => r.text()).then(t => ({name:'phaser.min.js', len: t.length})),
          fetch('main.js').then(r => r.text()).then(t => ({name:'main.js', len: t.length, text: t}))
        ]).then(results => {
          results.forEach(r => {
            if(r.status === 'fulfilled') write(r.value.name + ': ' + r.value.len + ' bytes');
            else write('FAILED to fetch: ' + (r.reason && r.reason.message));
          });

          const phaserPresent = !!window.Phaser;
          write('window.Phaser=' + phaserPresent);

          // If Phaser is present but no game was created, report it visibly.
          if(phaserPresent && !window.__pf_game){
            write('main.js has not created a game yet');
          }
        }).catch(e => { write('Diagnostics failed: '+(e && e.message)); });
      })();
    </script>
  </body>
</html>
